<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Exclusivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0b0b; color: #e5e5e5; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .profile-container { width: 100%; max-width: 480px; background: #121212; border: 1px solid #222; border-radius: 24px; padding: 40px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #d4af37; padding: 3px; margin: 0 auto 15px; }
        .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        .profile-name { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #d4af37; letter-spacing: 2px; margin-bottom: 5px; }
        .profile-bio { font-size: 0.8rem; color: #888; margin-bottom: 30px; font-weight: 300; }

        .links-wrapper { display: flex; flex-direction: column; gap: 12px; }
        .custom-link { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; color: #fff; text-decoration: none; transition: 0.2s ease; }
        .custom-link:hover { border-color: #d4af37; background: #222; transform: scale(1.02); }
        .link-left { display: flex; align-items: center; gap: 12px; }
        .link-left i { font-size: 1.1rem; color: #d4af37; }
        .link-text { font-size: 0.85rem; font-weight: 500; }

        .footer-note { margin-top: 35px; font-size: 0.7rem; color: #444; }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="avatar">
            <img src="logo.png" alt="Perfil">
        </div>
        <h1 class="profile-name">ACCESO PRIVADO</h1>
        <p class="profile-bio">Directorio oficial de plataformas y vías de soporte.</p>

        <div class="links-wrapper">
            <a href="https://t.me/PLACERARDIENTE" target="_blank" class="custom-link">
                <div class="link-left"><i class="fab fa-telegram"></i><span class="link-text">Comunidad Telegram</span></div>
                <i class="fas fa-arrow-right" style="font-size:0.7rem; color:#555;"></i>
            </a>

            <a href="https://www.instagram.com/placerardiente" target="_blank" class="custom-link">
                <div class="link-left"><i class="fab fa-instagram"></i><span class="link-text">Canal Instagram</span></div>
                <i class="fas fa-arrow-right" style="font-size:0.7rem; color:#555;"></i>
            </a>

            <a href="https://t.me/PLACEROCULTO21" target="_blank" class="custom-link">
                <div class="link-left"><i class="fas fa-paper-plane"></i><span class="link-text">Atención Directa</span></div>
                <i class="fas fa-arrow-right" style="font-size:0.7rem; color:#555;"></i>
            </a>
        </div>

        <div class="footer-note">Portal Verificado &copy; 2026</div>
    </div>
</body>
</html>
