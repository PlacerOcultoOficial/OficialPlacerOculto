<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Canales</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Roboto', sans-serif; display: flex; min-height: 100vh; }

        .sidebar { width: 250px; background-color: #1e293b; padding: 30px 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #334155; }
        .brand-header { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .brand-header img { width: 32px; height: 32px; border-radius: 6px; }

        .content-area { flex: 1; padding: 40px; overflow-y: auto; }
        .page-header { margin-bottom: 30px; }
        .page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .page-subtitle { color: #94a3b8; font-size: 0.85rem; }

        .list-container { display: flex; flex-direction: column; gap: 15px; max-width: 800px; }
        .list-row { background: #1e293b; padding: 18px 25px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .list-info { display: flex; align-items: center; gap: 15px; }
        .list-icon { width: 40px; height: 40px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #38bdf8; }
        .list-name { font-weight: 500; font-size: 0.95rem; }
        
        .btn-connect { background: #0284c7; color: white; text-decoration: none; padding: 8px 18px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; transition: 0.2s; }
        .btn-connect:hover { background: #0369a1; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #334155; padding: 15px 20px; }
            .content-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand-header">
            <img src="logo.png" alt="Logo">
            <span>PORTAL HUB</span>
        </div>
        <div style="font-size: 0.75rem; color: #64748b;">v2.0 - 2026</div>
    </aside>

    <main class="content-area">
        <header class="page-header">
            <h1 class="page-title">Directorio de Enlaces</h1>
            <p class="page-subtitle">Selecciona la plataforma a la que deseas ingresar.</p>
        </header>

        <section class="list-container">
            <div class="list-row">
                <div class="list-info">
                    <div class="list-icon"><i class="fab fa-telegram-plane"></i></div>
                    <div class="list-name">Canal Oficial Telegram</div>
                </div>
                <a href="https://t.me/PLACERARDIENTE" target="_blank" class="btn-connect">Abrir</a>
            </div>

            <div class="list-row">
                <div class="list-info">
                    <div class="list-icon"><i class="fab fa-instagram"></i></div>
                    <div class="list-name">Perfil de Instagram</div>
                </div>
                <a href="https://www.instagram.com/placerardiente" target="_blank" class="btn-connect">Ver Perfil</a>
            </div>

            <div class="list-row">
                <div class="list-info">
                    <div class="list-icon"><i class="fas fa-comments"></i></div>
                    <div class="list-name">Mensajes & Atención</div>
                </div>
                <a href="https://t.me/PLACEROCULTO21" target="_blank" class="btn-connect">Enviar Mensaje</a>
            </div>
        </section>
    </main>
</body>
</html>
